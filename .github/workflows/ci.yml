name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: test / vet / wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Verify modules
        run: |
          go mod download
          go mod verify

      - name: Source guards
        run: make guards

      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "not gofmt'd:"; echo "$out"; exit 1; fi

      - name: Unit tests
        run: go test ./... -count=1 -race -coverprofile=coverage.out

      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1

      - name: Vet (wasm target)
        run: GOOS=wasip1 GOARCH=wasm go vet ./...

      - name: Build wasm
        run: |
          GOOS=wasip1 GOARCH=wasm go build -buildmode=c-shared -o main.wasm ./
          ls -lh main.wasm

      - uses: actions/upload-artifact@v4
        with:
          name: main.wasm
          path: main.wasm
          retention-days: 7

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --timeout=5m
