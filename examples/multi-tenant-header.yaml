# ═══════════════════════════════════════════════════════════════════════════
# 场景三：按流量特征拆 route（推荐的多模态处理方式）
#
# 一条链路上既有 vision 又有纯文本时，不要为了 vision 把所有流量的降级目标
# 都抬高——那会让 95% 的纯文本流量陪着少省钱。
#
# 正确做法是用 Higress 原生的 matchRules 按 route 分开配：
# 「这批流量长什么样」的判断放在路由层，插件只在给定 route 上执行既定策略。
#
# 本例同时演示按自定义 header 分租户（适合网关前已有 BFF 做过身份识别）。
# ═══════════════════════════════════════════════════════════════════════════
apiVersion: extensions.higress.io/v1alpha1
kind: WasmPlugin
metadata:
  name: higress-budget-router
  namespace: higress-system
spec:
  phase: UNSPECIFIED_PHASE
  priority: 800
  url: oci://ghcr.io/OWNER/higress-budget-router:0.1.0
  defaultConfigDisable: true

  matchRules:
    # ───────────────────────────────────────────────────────────────────
    # 多模态流量：只能降到同样支持 vision 的模型，省得少但安全
    # ───────────────────────────────────────────────────────────────────
    - ingress:
        - higress-system/llm-vision
      configDisable: false
      config:
        rule_name: prod-tenant-budget      # 与下面共用同一份预算账本
        redis: { service_name: redis.dns, service_port: 6379, timeout: 1000 }
        tenant_source: { type: header, key: x-tenant-id }
        budget_period: 86400
        quota: 500

        traffic_profile: [vision, tools]   # ← 这条 route 会发图片 + 工具调用

        model_prices:
          gpt-4o:      { input: 2.5,  output: 10  }
          gpt-4o-mini: { input: 0.15, output: 0.6 }
        model_capabilities:
          gpt-4o:      { tools: true, vision: true }
          gpt-4o-mini: { tools: true, vision: true }

        degrade_levels:
          # 只有一档：能同时满足 vision + tools 的便宜模型不多
          - { name: degrade,   threshold: 0.30, model: gpt-4o-mini, max_request_bytes: 200000 }
          - { name: exhausted, threshold: 0.0,  reject: true }

        rejected_message: '{"error":{"code":"budget_exhausted","message":"本租户今日 AI 预算已用尽，请联系管理员或等待次日重置"}}'
        fail_open: true

    # ───────────────────────────────────────────────────────────────────
    # 纯文本流量：没有多模态包袱，可以降得更狠
    # ───────────────────────────────────────────────────────────────────
    - ingress:
        - higress-system/llm-text
      configDisable: false
      config:
        rule_name: prod-tenant-budget      # 同名 → 与上面共用同一个 Redis 计数键
        redis: { service_name: redis.dns, service_port: 6379, timeout: 1000 }
        tenant_source: { type: header, key: x-tenant-id }
        budget_period: 86400
        quota: 500

        traffic_profile: [tools]           # ← 只用到工具调用

        model_prices:
          gpt-4o:      { input: 2.5,  output: 10   }
          qwen-plus:   { input: 0.8,  output: 2    }
          deepseek-v3: { input: 0.14, output: 0.28 }
        model_capabilities:
          gpt-4o:      { tools: true, vision: true  }
          qwen-plus:   { tools: true, vision: false }
          deepseek-v3: { tools: true, vision: false }

        degrade_levels:
          # deepseek-v3 窗口比 qwen-plus 小，所以字节阈值也更小
          - { name: warn,      threshold: 0.40, model: qwen-plus,   max_request_bytes: 200000 }
          - { name: degrade,   threshold: 0.15, model: deepseek-v3, max_request_bytes: 120000 }
          - { name: exhausted, threshold: 0.0,  reject: true }

        fail_open: true

# 注：两条规则的 rule_name 相同 → Redis 键相同 → 共用一份租户预算。
#     若希望两条链路各自独立计费，把 rule_name 改成不同的值即可。
