# ═══════════════════════════════════════════════════════════════════════════
# 场景二：灰度观察（第一次上线请用这份）
#
# dry_run: true 会完整走一遍决策链——查水位、匹配档位、判断是否更便宜、
# 判断请求体大小——但最后一步不改写请求，也不拒绝任何流量。
#
# 注意：dry_run 期间响应阶段的 Redis 扣减【照常执行】，所以水位是真实的，
#       观察到的档位分布也就是真实的。
#
# 本阶段要收集的两类数据（见 docs/user-manual.md「校准」一节）：
#
#   1. 档位分布是否合理
#      日志字段 budget_level：normal / warn / degrade / exhausted 各占多少？
#      exhausted 出现过就说明阶梯没兜住，要加档或调阈值。
#
#   2. 反推 max_request_bytes  ← 这是本阶段最重要的产出
#      把 budget_request_bytes（请求阶段记的字节数）与
#      usage.prompt_tokens（响应阶段拿到的真实 token 数）配对，
#      算出本链路真实的「字节/token」比值，再据此定阈值。
#      注意取观测到的【最小】比值，不是平均值——见用户手册。
#
# 本例刻意不配 max_request_bytes：还没有数据，配了也是拍脑袋。
# ═══════════════════════════════════════════════════════════════════════════
apiVersion: extensions.higress.io/v1alpha1
kind: WasmPlugin
metadata:
  name: higress-budget-router
  namespace: higress-system
spec:
  phase: UNSPECIFIED_PHASE
  priority: 800
  url: oci://ghcr.io/OWNER/higress-budget-router:0.1.0
  defaultConfigDisable: true
  matchRules:
    - ingress:
        - higress-system/llm-gateway
      configDisable: false
      config:
        rule_name: tenant-daily-budget
        redis:
          service_name: redis.dns
          service_port: 6379
          timeout: 1000
        tenant_source:
          type: consumer
        budget_period: 86400
        quota: 200

        traffic_profile: [tools]

        model_prices:
          gpt-4o:      { input: 2.5,  output: 10   }
          qwen-plus:   { input: 0.8,  output: 2    }
          deepseek-v3: { input: 0.14, output: 0.28 }
        model_capabilities:
          gpt-4o:      { tools: true, vision: true,  json_schema: true  }
          qwen-plus:   { tools: true, vision: false, json_schema: true  }
          deepseek-v3: { tools: true, vision: false, json_schema: false }

        # 灰度期阈值故意设宽一点，好观察到更多档位的分布
        degrade_levels:
          - { name: warn,      threshold: 0.50, model: qwen-plus }
          - { name: degrade,   threshold: 0.20, model: deepseek-v3 }
          - { name: exhausted, threshold: 0.0,  reject: true }

        dry_run: true             # ← 灰度开关
        fail_open: true
        record_attribute: true    # 必须为 true，否则观察不到任何数据
